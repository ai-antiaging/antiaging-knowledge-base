name: Sync exBAClock Database

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一凌晨 2:00 UTC（北京时间 10:00）
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-exbaclock:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Run sync script
        id: sync
        run: |
          python scripts/sync-exbaclock.py
          echo "sync_completed=true" >> $GITHUB_OUTPUT
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet content/aging-clocks.md || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/aging-clocks.md data/
          git commit -m "docs: 自动同步 exBAClock 数据库 $(date +%Y-%m-%d)"
          git push

      - name: Trigger Pages deployment
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          curl -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"             https://api.github.com/repos/ai-antiaging/antiaging-knowledge-base/actions/workflows/hugo.yml/dispatches             -d '{"ref":"main"}'

      
      - name: Create issue if sync fails
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "⚠️ exBAClock 同步失败"
          content-filepath: data/sync-error.md
          labels: automated, data-sync, exbaclock
      
      - name: Upload sync report
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: data/
