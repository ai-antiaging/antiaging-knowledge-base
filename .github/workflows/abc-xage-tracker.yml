name: ABC X-Age Tracker

on:
  schedule:
    - cron: '0 3 * * 1'  # 每周一凌晨 3:00 UTC（北京时间 11:00）
  workflow_dispatch:  # 允许手动触发
    inputs:
      lookback_days:
        description: '回溯天数（用于补更）'
        required: false
        default: '7'
        type: string
      output_date:
        description: '输出日期 YYYY-MM-DD（用于补更）'
        required: false
        default: ''
        type: string

jobs:
  abc-tracker:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Create directories
        run: |
          mkdir -p content/news/abc-updates
          mkdir -p data
      
      - name: Run ABC tracker
        id: abc-track
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          OUTPUT_DATE: ${{ github.event.inputs.output_date || '' }}
        run: |
          python scripts/abc-xage-tracker.py
          echo "abc_completed=true" >> $GITHUB_OUTPUT
      
      - name: Check for new content
        id: git-check
        run: |
          git diff --quiet content/news/abc-updates/ || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push ABC report
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/news/abc-updates/
          git commit -m "docs: 自动生成 ABC/X-Age 追踪报告 $(date +%Y-%m-%d)"
          git push
      
      - name: Create issue if ABC tracker fails
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "⚠️ ABC/X-Age 追踪失败"
          content-filepath: data/abc-error.md
          labels: automated, abc-tracker
