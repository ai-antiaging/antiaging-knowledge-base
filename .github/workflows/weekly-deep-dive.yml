name: Weekly Deep Dive

on:
  schedule:
    - cron: '0 2 * * 2'  # 每周二凌晨 2:00 UTC（北京时间 10:00）
  workflow_dispatch:  # 允许手动触发
    inputs:
      lookback_days:
        description: '回溯天数（用于补更）'
        required: false
        default: '7'
        type: string
      output_date:
        description: '输出日期 YYYY-MM-DD（用于补更）'
        required: false
        default: ''
        type: string

jobs:
  weekly-deep-dive:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Create directories
        run: |
          mkdir -p content/news/deep-dive
          mkdir -p data
      
      - name: Run weekly deep dive generator
        id: deep-dive
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          OUTPUT_DATE: ${{ github.event.inputs.output_date || '' }}
        run: |
          python scripts/weekly-deep-dive.py
          echo "deep_dive_completed=true" >> $GITHUB_OUTPUT
      
      - name: Check for new content
        id: git-check
        run: |
          git diff --quiet content/news/deep-dive/ || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push weekly deep dive
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/news/deep-dive/
          git commit -m "docs: 自动生成周深度解读 $(date +%Y-%m-%d)"
          git push

      - name: Trigger Pages deployment
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          curl -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"             https://api.github.com/repos/ai-antiaging/antiaging-knowledge-base/actions/workflows/hugo.yml/dispatches             -d '{"ref":"main"}'

      
      - name: Create issue if deep dive fails
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "⚠️ 周深度解读生成失败"
          content-filepath: data/deep-dive-error.md
          labels: automated, deep-dive
