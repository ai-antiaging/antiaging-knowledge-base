name: Research Snapshot

on:
  schedule:
    - cron: '30 0 * * *'  # 每天凌晨 00:30 UTC（北京时间 08:30）
  workflow_dispatch:  # 允许手动触发

jobs:
  research-snapshot:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Create directories
        run: |
          mkdir -p content/news/snapshots
          mkdir -p data
      
      - name: Run snapshot generator
        id: snapshot
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
        run: |
          python scripts/research-snapshot.py
          echo "snapshot_completed=true" >> $GITHUB_OUTPUT
      
      - name: Check for new content
        id: git-check
        run: |
          git diff --quiet content/news/snapshots/ || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push snapshots
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/news/snapshots/
          git commit -m "docs: 自动生成研究快照 $(date +%Y-%m-%d)"
          git push
      
      - name: Create issue if snapshot fails
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "⚠️ 研究快照生成失败"
          content-filepath: data/snapshot-error.md
          labels: automated, snapshot
